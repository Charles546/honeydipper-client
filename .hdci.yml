---
use_templates:
  - Charles546/honeydipper-client@refs/heads/test:hdci.tmpl.yml

triggers:
  - conditions:
      gh_event: push
    stages:
      - test

stages:
  test:
    jobs:
      - test

jobs:
  test:
    steps:
      - load_secret_driver
      - github_checkout
      - container_name: test
        executor:
          - sh-c
          - run_in_repo
        run: ls -l
        image: docker.io/library/golang:1.26.0-alpine
