---
triggers:
  - conditions:
      gh_event: push
    stages:
      - test

stages:
  test:
    steps:
      - test

jobs:
  test:
    script_name: test
    pre_steps:
      - secretDriverLoader
      - checkout

scripts:
  secretDriverLoader:
    entrypoint: ['/bin/sh', '-c']
    env:
      SEC_DRIVER: $ctx.hdci.worker.sec_driver
      WORK_DIR: $ctx.hdci.worker.work_dir,"/opt/honeydipper"
    image: $ctx.hdci.worker.sec_driver_image
    run: cp $SEC_DRIVER $WORK_DIR
  checkout:
    run: echo $GH_APP_KEY | head -n 2
    image: docker.io/alpine/git:latest
    env: $?ctx.hdci.worker.env
    volumes: $?ctx.hdci.worker.volumes
    entrypoint:
      - '{{ .ctx.hdci.worker.work_dir }}/{{ base .ctx.hdci.worker.sec_driver }}'
      - 'exec'
      - '/bin/sh'
      - '-c'
  test:
    run: echo go test -v ./...
    image: docker.io/library/golang:1.26.0-alpine
