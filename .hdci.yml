---
use_templates:
  # - Charles546/honeydipper-ci@refs/heads/main:resources/hdci.tmpl.yml
  - hdci.tmpl.yml

cache:
  /local/cached: 'hd-cache-{{ replace "/" "_" .ctx.git_repo }}-{{ .ctx.git_commit | trunc 7 }}'

executors:
  golang:
    image: docker.io/library/golang:1.26.0-alpine
    cache:
      - /local/cached

default_executors++:
  - golang

triggers:
  - conditions:
      gh_event: push
    stages:
      - test
      - check-license

stages:
  check-license:
    jobs:
      - job_name: check-license
        steps:
          - run: sleep 10 && echo sleeped and done && ls -l /local/cached
  test:
    jobs:
      - test
    requires:
      - check-license

jobs:
  test:
    steps:
      - container_name: test
        run: ls -l && date > /local/cached/current_time
        skip_executors:
          - with_secret_driver
    skip_steps: "*"
